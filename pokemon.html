<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">


</head>
<body>

<h1>Pokédex</h1>
<p>Pokemon</p>

<h2>Pokemon</h2>

<label for="search">Pokémon name:</label>
<input type="text" id="search" placeholder="Enter name">

<label for="type">Pokémon type:</label>
<select id="type">
    <option value="">All types</option>
    <option value="Fire">Fire</option>
    <option value="Water">Water</option>
    <option value="Grass">Grass</option>
    <option value="Electric">Electric</option>
</select>

<label for="attack">Minimum attack:</label>
<input type="number" id="attack" min="0" placeholder="Enter attack">

<button id="filterButton">Filter Pokémon</button>

<h2>All Pokémon</h2>

<div id="pokemonList"></div>
<script src="pokemon.js"></script>
</body>
</html>
