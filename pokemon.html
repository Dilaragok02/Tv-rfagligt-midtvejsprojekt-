<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon - Pokedox</title>
    <link rel="stylesheet" href="main.css">
</head>

<body class="pokemon-page">

<!-- Navigation -->
<header>
    <h1>Pokemon</h1>

    <nav>
        <a href="pokemon.html" class="active">Pokémon</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="trainer.html">Trainers</a>
    </nav>
</header>

<main>

    <!-- Overskrift -->
    <section class="pokemon-intro">
        <h2>Pokémon</h2>
        <p>
            Udforsk alle Pokémon og se deres stats.
            Brug filtrene til at finde præcis de Pokémon,
            du er interesseret i.
        </p>
    </section>

    <!-- Filtre -->
    <section class="filters">

        <div class="filter-group">
            <label for="search">Søg efter navn</label>
            <input
                    type="text"
                    id="search"
                    placeholder="Søg efter Pokémon...">
        </div>

        <div class="filter-group">
            <label for="type">Filtrer efter type</label>
            <select id="type">
                <option value="">Alle typer</option>
                <option value="Normal">Normal</option>
                <option value="Fire">Fire</option>
                <option value="Water">Water</option>
                <option value="Electric">Electric</option>
                <option value="Grass">Grass</option>
                <option value="Ice">Ice</option>
                <option value="Fighting">Fighting</option>
                <option value="Poison">Poison</option>
                <option value="Ground">Ground</option>
                <option value="Flying">Flying</option>
                <option value="Psychic">Psychic</option>
                <option value="Bug">Bug</option>
                <option value="Rock">Rock</option>
                <option value="Ghost">Ghost</option>
                <option value="Dragon">Dragon</option>
                <option value="Fairy">Fairy</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="attack">Minimum attack</label>
            <input
                    type="number"
                    id="attack"
                    min="0"
                    placeholder="Min. attack">
        </div>

        <div class="filter-group">
            <label for="sort">Sortér efter</label>
            <select id="sort">
                <option value="">Pokédex nummer</option>
                <option value="nameAZ">Navn (A-Z)</option>
                <option value="nameZA">Navn (Z-A)</option>
                <option value="hp">HP (Højeste først)</option>
                <option value="attack">Attack (Højeste først)</option>
                <option value="speed">Speed (Højeste først)</option>
            </select>
        </div>

        <button id="filterButton">Filtrer</button>
        <button id="resetButton">Ryd filtre</button>

    </section>

    <!-- Pokémon tabel -->
    <section class="pokemon-table-section">

        <div class="table-wrapper">
            <table class="pokemon-table">

                <thead>
                <tr>
                    <th>#</th>
                    <th>Pokémon</th>
                    <th>Type</th>
                    <th>HP</th>
                    <th>Attack</th>
                    <th>Defense</th>
                    <th>Sp. Atk</th>
                    <th>Sp. Def</th>
                    <th>Speed</th>
                    <th></th>
                </tr>
                </thead>

                <tbody id="pokemonList">
                <!-- Pokémon indsættes med JavaScript -->
                </tbody>

            </table>
        </div>

        <!-- Sideinddeling -->
        <div class="pagination">
            <p id="pokemonCount"></p>
            <div id="paginationButtons"></div>
        </div>

    </section>



</main>

<script src="pokemon.js"></script>

</body>
</html>
