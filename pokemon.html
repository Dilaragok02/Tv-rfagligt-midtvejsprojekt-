<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<Body class="pokemon-page">


<h1>Pokemonx</h1>
<p>Pokemon</p>

<h2>Pokemon</h2>

<label for="search">Pokémon name:</label>
<input type="text" id="search" placeholder="Enter name">

<label for="type">Pokémon type:</label>
<select id="type">
    <option value="">All types</option>
    <option value="Fire">Fire</option>
    <option value="Water">Water</option>
    <option value="Grass">Grass</option>
    <option value="Electric">Electric</option>
</select>

<label for="attack">Minimum attack:</label>
<input type="number" id="attack" min="0" placeholder="Enter attack">

<button id="filterButton">Filter Pokémon</button>
<button id="resetButton">Reset Filters</button>

<label for="sort">Sort Pokémon:</label>
<select id="sort">
    <option value="">Default</option>
    <option value="nameAZ">Name (A-Z)</option>
    <option value="nameZA">Name (Z-A)</option>
    <option value="hp">HP (Highest first)</option>
    <option value="attack">Attack (Highest first)</option>
    <option value="speed">Speed (Highest first)</option>
</select>



<h2>All Pokémon</h2>

<div id="pokemonList"></div>
<div id="pokemonDetails"></div>

<script src="pokemon.js"></script>
</body>
</html>
